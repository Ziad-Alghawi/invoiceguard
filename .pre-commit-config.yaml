# Run on every commit: `uvx pre-commit install` once, then `uvx pre-commit run --all-files` to check everything.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The DATEV golden file is byte-exact (CRLF, Windows-1252); never rewrite it.
      - id: end-of-file-fixer
        exclude: ^apps/api/tests/fixtures/datev/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^apps/api/tests/fixtures/datev/
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Prettier from apps/web (the version pinned in its lockfile), so pre-commit and CI format the same way.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (apps/web)
        language: system
        entry: pnpm --dir apps/web format
        files: ^apps/web/
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Lock files, and eval data that is hashes by design: SHA-256 pins, recorded replies keyed by
        # hash, generated invoices and demo PDFs with fictitious IBANs (ADR-019, ADR-026), packaged
        # embedding vectors in base64, keyed by text or by section hash (ADR-020), and SealedSecrets:
        # ciphertext only the demo cluster's key decrypts (ADR-021). All code stays scanned.
        exclude: (^|/)(uv\.lock|pnpm-lock\.yaml)$|^packages/evals/(sources\.json|datasets/(generated|demo)/|recordings/|reports/)|^apps/api/src/invoiceguard_api/(booking|rulebook)/vectors\.json$|^infra/argocd/apps/sealed-secret-[^/]+\.yaml$
