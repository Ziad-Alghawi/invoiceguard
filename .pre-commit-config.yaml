# Run on every commit: `uvx pre-commit install` once, then `uvx pre-commit run --all-files` to check everything.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Prettier from apps/web (the version pinned in its lockfile), so pre-commit and CI format the same way.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (apps/web)
        language: system
        entry: pnpm --dir apps/web format
        files: ^apps/web/
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (^|/)(uv\.lock|pnpm-lock\.yaml)$
