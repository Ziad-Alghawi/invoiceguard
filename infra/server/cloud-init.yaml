#cloud-config
# First boot of the demo server (ADR-014, ADR-021): pasted into "Cloud config" when the server is
# created in the Hetzner Console (docs/deploy.md). Runs once, as root. Check it finished with
#   ssh root@<IP> cloud-init status --wait
#
# Afterwards, by hand: give deploy a password for sudo (`passwd deploy`, as root), then turn off
# root login over SSH. Until then root keeps the SSH key Hetzner put in.

package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - git
  - make
  - ca-certificates
  - curl

# Security updates install themselves (what `dpkg-reconfigure unattended-upgrades` writes).
write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# 2 GB swap: a cushion for memory peaks next to k3s and the validator's JVM.
swap:
  filename: /swapfile
  size: 2G

runcmd:
  # Docker Engine and the Compose plugin from Docker's apt repository: the shared Caddy (/opt/edge)
  # runs in Docker; the apps run in k3s, which has its own containerd.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >-
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  # deploy for day-to-day work, with root's SSH key (the key Hetzner put in; it is not in this
  # file). sudo asks for deploy's password, which is set by hand. Membership in the docker group is
  # root-equivalent; it only saves typing sudo for Caddy.
  - adduser --disabled-password --gecos "" deploy
  - usermod -aG sudo,docker deploy
  - install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
  - install -m 600 -o deploy -g deploy /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - install -d -o deploy -g deploy /opt/edge /opt/invoiceguard
