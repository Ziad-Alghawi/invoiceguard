# Public demo on one VPS (ADR-014): layered on top of docker-compose.yml.
# Run from the repo root with `make prod-up`, which runs:
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up ...
# No service here has public ports. The server's shared Caddy (infra/edge, running in /opt/edge)
# reaches the web container over the external `edge` network and terminates HTTPS.
# Every secret comes from the server's .env (mode 600), never from the repo. See docs/deploy.md.

# Rotate container logs, so a busy week cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    restart: unless-stopped
    logging: *logging
    # No host port: only the api reaches the database, over the Compose network.
    ports: !reset []

  # One-shot (no restart): migrations and role passwords before the api starts, and
  # `make demo-reset` as the database owner (ADR-022).
  migrate:
    logging: *logging
    environment:
      INVOICEGUARD_ENV: prod
      # Allows `make demo-reset`, which deletes every invoice.
      INVOICEGUARD_DEMO_MODE: "true"

  api:
    restart: unless-stopped
    logging: *logging
    # No host port: the browser talks to the web server only (backend for frontend).
    ports: !reset []
    environment:
      # Secure session cookies (HTTPS only); see Settings.secure_cookies.
      INVOICEGUARD_ENV: prod
      # Refuses PDF uploads without embedded e-invoice XML (no visitor PDF goes to a model).
      INVOICEGUARD_DEMO_MODE: "true"
      # Stop LLM extraction for the day once this much is spent (US dollars).
      INVOICEGUARD_LLM_DAILY_BUDGET_USD: ${INVOICEGUARD_LLM_DAILY_BUDGET_USD:-0.50}
      # Uploads per user per hour; the demo accounts are shared, so this caps all visitors.
      INVOICEGUARD_UPLOAD_MAX_PER_HOUR: ${INVOICEGUARD_UPLOAD_MAX_PER_HOUR:-30}

  mcp-erp:
    restart: unless-stopped
    logging: *logging
    # No host port: only the api calls the MCP servers, over the Compose network.
    ports: !reset []

  mcp-registry:
    restart: unless-stopped
    logging: *logging
    ports: !reset []

  mcp-history:
    restart: unless-stopped
    logging: *logging
    ports: !reset []

  validator:
    restart: unless-stopped
    logging: *logging
    ports: !reset []
    # The JVM takes 75 % of this as its maximum heap (services/validator/Dockerfile); without a
    # limit it would size the heap from the whole server's memory.
    mem_limit: 1g

  web:
    restart: unless-stopped
    logging: *logging
    ports: !reset []
    environment:
      # The shared demo accounts, shown on the login page (ADR-006, ADR-016); the same values that
      # `make demo-reset` seeds. The approver is optional: without it, overrides cannot be confirmed.
      DEMO_LOGIN_EMAIL: ${INVOICEGUARD_SEED_USER_EMAIL:?set INVOICEGUARD_SEED_USER_EMAIL in .env}
      DEMO_LOGIN_PASSWORD: ${INVOICEGUARD_SEED_USER_PASSWORD:?set INVOICEGUARD_SEED_USER_PASSWORD in .env}
      DEMO_APPROVER_EMAIL: ${INVOICEGUARD_SEED_APPROVER_EMAIL:-}
      DEMO_APPROVER_PASSWORD: ${INVOICEGUARD_SEED_APPROVER_PASSWORD:-}
    networks:
      default:
      edge:
        # Unique on the shared network: other projects may also have a service called `web`.
        aliases:
          - invoiceguard-web

networks:
  edge:
    external: true
    name: edge
