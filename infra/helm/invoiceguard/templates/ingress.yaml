{{- if .Values.ingress.enabled }}
{{- $ctx := dict "ctx" . "component" "web" -}}
{{- $limit := include "invoiceguard.name" (dict "ctx" . "component" "body-limit") -}}
# Traefik refuses request bodies above the limit with 413, before they reach the web server. Caddy
# in front sets its own limit (ADR-021: two proxies, two limits).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $limit }}
  labels:
    {{- include "invoiceguard.labels" $ctx | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ int .Values.ingress.maxRequestBodyBytes }}
---
# Only the web server is exposed; the api is reached through it (backend for frontend).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "invoiceguard.fullname" . }}
  labels:
    {{- include "invoiceguard.labels" $ctx | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace $limit }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "invoiceguard.name" $ctx }}
                port:
                  name: http
{{- end }}
