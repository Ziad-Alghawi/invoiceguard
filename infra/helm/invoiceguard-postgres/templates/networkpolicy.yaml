{{- if .Values.networkPolicy.enabled }}
# Only the InvoiceGuard pods labelled as database clients reach PostgreSQL; nothing else may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "postgres.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.clientLabels | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
