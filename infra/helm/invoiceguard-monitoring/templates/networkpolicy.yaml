{{- if .Values.networkPolicy.enabled }}
# Nothing reaches Prometheus over the pod network (kubectl port-forward connects inside the pod's own
# network namespace, so it still works); it talks to the api pods and the cluster DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "monitoring.fullname" . }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "monitoring.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.api.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
    - to:
        {{- toYaml .Values.networkPolicy.dnsTo | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
