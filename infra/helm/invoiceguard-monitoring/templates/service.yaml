# ClusterIP only, no Ingress: reached with kubectl port-forward (docs/deploy.md, ADR-025).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring.fullname" . }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "monitoring.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
