# Prometheus for InvoiceGuard (ADR-025), in the namespace of the invoiceguard chart. Install after it:
#   helm install invoiceguard-monitoring infra/helm/invoiceguard-monitoring --wait

image:
  # Prometheus v3.16.0, pinned by digest: a tag can be moved, a digest cannot. The image runs as
  # nobody (65534) and includes promtool, which CI uses to check the config and test the rules.
  repository: prom/prometheus
  tag: v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
  pullPolicy: IfNotPresent

# 30 s is plenty for a demo and keeps the samples (and memory) low.
scrapeInterval: 30s

retention:
  time: 7d
  # A hard cap besides the time: the oldest blocks go first when the data reaches it.
  size: 300MB

# The headless Service of the invoiceguard chart: its DNS name resolves to every api pod.
api:
  service: invoiceguard-api-metrics
  port: 8000
  # The api pods' labels, for the egress rule.
  podLabels:
    app.kubernetes.io/name: invoiceguard
    app.kubernetes.io/component: api

persistence:
  size: 1Gi
  # Empty: the cluster's default class (local-path on k3s).
  storageClass: ""

# One 4 GB node (ADR-021): about 1.3 GB is available with the app running, and the gate for this
# chart is 1.0 GB. GOMEMLIMIT makes the Go runtime collect garbage well before the limit.
goMemLimit: 150MiB
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 192Mi

networkPolicy:
  enabled: true
  # The cluster DNS, for the api's headless Service.
  dnsTo:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
