# Local development stack: api + web + db + validator (KoSIT, ADR-009).
# Run from the repo root with `make dev`, which passes the root .env:
#   docker compose --env-file .env -f infra/docker-compose.yml up --build --wait

name: invoiceguard

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: ../apps/api
    # Apply pending migrations, then serve. In Kubernetes (R4) migrations become a separate Job.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn --factory invoiceguard_api.main:create_app --host 0.0.0.0 --port 8000
    environment:
      INVOICEGUARD_ENV: ${INVOICEGUARD_ENV:-dev}
      INVOICEGUARD_LOG_LEVEL: ${INVOICEGUARD_LOG_LEVEL:-INFO}
      # Address of the db service on the Compose network; credentials from the root .env.
      INVOICEGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INVOICEGUARD_MAX_UPLOAD_BYTES: ${INVOICEGUARD_MAX_UPLOAD_BYTES:-10485760}
      # Address of the validator service on the Compose network. The api does not wait for it:
      # while it is down, the KoSIT check is skipped and the other checks still run.
      INVOICEGUARD_VALIDATOR_URL: http://validator:8080/
      INVOICEGUARD_VALIDATOR_TIMEOUT_SECONDS: ${INVOICEGUARD_VALIDATOR_TIMEOUT_SECONDS:-20}
      # LLM extraction (ADR-010); an empty key turns it off and plain PDFs wait.
      INVOICEGUARD_LLM_API_KEY: ${INVOICEGUARD_LLM_API_KEY:-}
      INVOICEGUARD_EXTRACTION_MODEL: ${INVOICEGUARD_EXTRACTION_MODEL:-}
      INVOICEGUARD_LLM_TIMEOUT_SECONDS: ${INVOICEGUARD_LLM_TIMEOUT_SECONDS:-}
      INVOICEGUARD_EXTRACTION_REASONING_EFFORT: ${INVOICEGUARD_EXTRACTION_REASONING_EFFORT:-}
      INVOICEGUARD_EXTRACTION_CONFIDENCE_THRESHOLD: ${INVOICEGUARD_EXTRACTION_CONFIDENCE_THRESHOLD:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  validator:
    # Official KoSIT validator with the XRechnung configuration; healthcheck in the Dockerfile.
    build: ../services/validator
    ports:
      - "127.0.0.1:${VALIDATOR_PORT:-8081}:8080"

  web:
    build: ../apps/web
    environment:
      # Address of the api service on the Compose network (not localhost).
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  uploads:
