# Local development stack: api + web + db + validator (KoSIT, ADR-009) + the read-only MCP servers
# mcp-erp, mcp-registry and mcp-history (ADR-017).
# Run from the repo root with `make dev`, which passes the root .env:
#   docker compose --env-file .env -f infra/docker-compose.yml up --build --wait

name: invoiceguard

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot owner step (ADR-022): apply pending migrations and give the restricted roles their
  # passwords, as the database owner, then exit. The api starts only after it succeeded. Owner
  # tasks that the api's role may not do run here too: `make demo-reset`. In Kubernetes (R4-3)
  # this becomes an Argo CD PreSync Job.
  migrate:
    build: &api-build
      context: ../apps/api
      # The rulebook's Markdown files (docs/rulebook), copied to /app/rulebook for `make index`.
      additional_contexts:
        rulebook: ../docs/rulebook
    command: ["sh", "-c", "alembic upgrade head && invoiceguard-db-roles"]
    environment:
      INVOICEGUARD_ENV: ${INVOICEGUARD_ENV:-dev}
      INVOICEGUARD_LOG_LEVEL: ${INVOICEGUARD_LOG_LEVEL:-INFO}
      # The owner: the only service with these credentials.
      INVOICEGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Passwords of the restricted roles (ADR-017, ADR-022), set by `invoiceguard-db-roles`;
      # empty = the role cannot log in.
      INVOICEGUARD_APP_DB_PASSWORD: ${INVOICEGUARD_APP_DB_PASSWORD:?set INVOICEGUARD_APP_DB_PASSWORD in .env}
      INVOICEGUARD_MCP_ERP_DB_PASSWORD: ${INVOICEGUARD_MCP_ERP_DB_PASSWORD:-}
      INVOICEGUARD_MCP_REGISTRY_DB_PASSWORD: ${INVOICEGUARD_MCP_REGISTRY_DB_PASSWORD:-}
      INVOICEGUARD_MCP_HISTORY_DB_PASSWORD: ${INVOICEGUARD_MCP_HISTORY_DB_PASSWORD:-}
      # For the demo reset, which loads and processes the samples like the api does.
      INVOICEGUARD_VALIDATOR_URL: http://validator:8080/
      INVOICEGUARD_EMBEDDING_MODEL: ${INVOICEGUARD_EMBEDDING_MODEL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    environment:
      INVOICEGUARD_ENV: ${INVOICEGUARD_ENV:-dev}
      INVOICEGUARD_LOG_LEVEL: ${INVOICEGUARD_LOG_LEVEL:-INFO}
      # The restricted role (ADR-022): data rights only, no TRUNCATE, DDL or trigger changes.
      # The password must be URL-safe (for example `openssl rand -hex 24`).
      INVOICEGUARD_DATABASE_URL: postgresql+psycopg://invoiceguard_app:${INVOICEGUARD_APP_DB_PASSWORD:?set INVOICEGUARD_APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}
      INVOICEGUARD_MAX_UPLOAD_BYTES: ${INVOICEGUARD_MAX_UPLOAD_BYTES:-10485760}
      INVOICEGUARD_UPLOAD_MAX_PER_HOUR: ${INVOICEGUARD_UPLOAD_MAX_PER_HOUR:-}
      # Address of the validator service on the Compose network. The api does not wait for it:
      # while it is down, the KoSIT check is skipped and the other checks still run.
      INVOICEGUARD_VALIDATOR_URL: http://validator:8080/
      INVOICEGUARD_VALIDATOR_TIMEOUT_SECONDS: ${INVOICEGUARD_VALIDATOR_TIMEOUT_SECONDS:-20}
      # LLM extraction (ADR-010); an empty key turns it off and plain PDFs wait.
      INVOICEGUARD_LLM_API_KEY: ${INVOICEGUARD_LLM_API_KEY:-}
      INVOICEGUARD_EXTRACTION_MODEL: ${INVOICEGUARD_EXTRACTION_MODEL:-}
      INVOICEGUARD_LLM_TIMEOUT_SECONDS: ${INVOICEGUARD_LLM_TIMEOUT_SECONDS:-}
      INVOICEGUARD_EXTRACTION_REASONING_EFFORT: ${INVOICEGUARD_EXTRACTION_REASONING_EFFORT:-}
      INVOICEGUARD_EXTRACTION_CONFIDENCE_THRESHOLD: ${INVOICEGUARD_EXTRACTION_CONFIDENCE_THRESHOLD:-}
      # Daily LLM spending cap in US dollars (ADR-014); empty = no cap.
      INVOICEGUARD_LLM_DAILY_BUDGET_USD: ${INVOICEGUARD_LLM_DAILY_BUDGET_USD:-}
      # Login sessions and lockout (ADR-011). The seed user's password is not passed here:
      # `make seed-user` hands it to the one seed command only.
      INVOICEGUARD_SESSION_TTL_MINUTES: ${INVOICEGUARD_SESSION_TTL_MINUTES:-}
      INVOICEGUARD_LOGIN_MAX_FAILURES: ${INVOICEGUARD_LOGIN_MAX_FAILURES:-}
      INVOICEGUARD_LOGIN_LOCKOUT_MINUTES: ${INVOICEGUARD_LOGIN_LOCKOUT_MINUTES:-}
      # A review decision waits this long for a run on the same invoice, then answers 409.
      INVOICEGUARD_DECISION_LOCK_TIMEOUT_MS: ${INVOICEGUARD_DECISION_LOCK_TIMEOUT_MS:-}
      # DATEV-style export (ADR-013); empty values keep the defaults in settings.py.
      INVOICEGUARD_DATEV_ADVISOR_NUMBER: ${INVOICEGUARD_DATEV_ADVISOR_NUMBER:-}
      INVOICEGUARD_DATEV_CLIENT_NUMBER: ${INVOICEGUARD_DATEV_CLIENT_NUMBER:-}
      INVOICEGUARD_DATEV_FISCAL_YEAR_START_MONTH: ${INVOICEGUARD_DATEV_FISCAL_YEAR_START_MONTH:-}
      INVOICEGUARD_DATEV_ACCOUNT_LENGTH: ${INVOICEGUARD_DATEV_ACCOUNT_LENGTH:-}
      INVOICEGUARD_DATEV_CHART_OF_ACCOUNTS: ${INVOICEGUARD_DATEV_CHART_OF_ACCOUNTS:-}
      INVOICEGUARD_DATEV_CREDITOR_ACCOUNT: ${INVOICEGUARD_DATEV_CREDITOR_ACCOUNT:-}
      INVOICEGUARD_DATEV_EXPENSE_ACCOUNT: ${INVOICEGUARD_DATEV_EXPENSE_ACCOUNT:-}
      INVOICEGUARD_DATEV_TAX_KEYS: ${INVOICEGUARD_DATEV_TAX_KEYS:-}
      # Exception agent (ADR-018): runs with a model key and these MCP servers; empty limits keep
      # the defaults in settings.py.
      INVOICEGUARD_MCP_ERP_URL: http://mcp-erp:8000/mcp
      INVOICEGUARD_MCP_REGISTRY_URL: http://mcp-registry:8000/mcp
      INVOICEGUARD_MCP_HISTORY_URL: http://mcp-history:8000/mcp
      INVOICEGUARD_AGENT_MODEL: ${INVOICEGUARD_AGENT_MODEL:-}
      # Booking suggestions (ADR-020): the embedding model; empty keeps the default.
      INVOICEGUARD_EMBEDDING_MODEL: ${INVOICEGUARD_EMBEDDING_MODEL:-}
      INVOICEGUARD_AGENT_REASONING_EFFORT: ${INVOICEGUARD_AGENT_REASONING_EFFORT:-}
      INVOICEGUARD_AGENT_MAX_STEPS: ${INVOICEGUARD_AGENT_MAX_STEPS:-}
      INVOICEGUARD_AGENT_MAX_TOOL_CALLS: ${INVOICEGUARD_AGENT_MAX_TOOL_CALLS:-}
      INVOICEGUARD_AGENT_TIMEOUT_SECONDS: ${INVOICEGUARD_AGENT_TIMEOUT_SECONDS:-}
      INVOICEGUARD_AGENT_COST_CAP_USD: ${INVOICEGUARD_AGENT_COST_CAP_USD:-}
      INVOICEGUARD_AGENT_AUTO_INVESTIGATE: ${INVOICEGUARD_AGENT_AUTO_INVESTIGATE:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Read-only MCP servers for the exception agent (ADR-017). Each logs in as its own database
  # role with SELECT on its own tables only; they start after `migrate`, which sets the passwords.
  mcp-erp:
    build: ../apps/mcp-erp
    environment:
      INVOICEGUARD_MCP_ERP_DATABASE_URL: postgresql://invoiceguard_mcp_erp:${INVOICEGUARD_MCP_ERP_DB_PASSWORD:?set INVOICEGUARD_MCP_ERP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${MCP_ERP_PORT:-8091}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp-registry:
    build: ../apps/mcp-registry
    environment:
      INVOICEGUARD_MCP_REGISTRY_DATABASE_URL: postgresql://invoiceguard_mcp_registry:${INVOICEGUARD_MCP_REGISTRY_DB_PASSWORD:?set INVOICEGUARD_MCP_REGISTRY_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${MCP_REGISTRY_PORT:-8092}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp-history:
    build: ../apps/mcp-history
    environment:
      INVOICEGUARD_MCP_HISTORY_DATABASE_URL: postgresql://invoiceguard_mcp_history:${INVOICEGUARD_MCP_HISTORY_DB_PASSWORD:?set INVOICEGUARD_MCP_HISTORY_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}
      # The vectors it compares were made with this model (the api's setting).
      INVOICEGUARD_EMBEDDING_MODEL: ${INVOICEGUARD_EMBEDDING_MODEL:-}
    ports:
      - "127.0.0.1:${MCP_HISTORY_PORT:-8093}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  validator:
    # Official KoSIT validator with the XRechnung configuration; healthcheck in the Dockerfile.
    build: ../services/validator
    ports:
      - "127.0.0.1:${VALIDATOR_PORT:-8081}:8080"

  web:
    build: ../apps/web
    environment:
      # Address of the api service on the Compose network (not localhost).
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  uploads:
