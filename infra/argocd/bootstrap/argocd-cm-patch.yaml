# Merged into Argo CD's argocd-cm once, after the install (docs/deploy.md):
#   kubectl -n argocd patch configmap argocd-cm --type merge --patch-file infra/argocd/bootstrap/argocd-cm-patch.yaml
# Argo CD does not assess the health of Application resources by default (since 1.8), so sync
# waves of the root app would not wait for PostgreSQL to be ready before the app. This is the health
# check from Argo CD's documentation: an Application is as healthy as its own status says.
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
