# systemd drop-in for k3s (ADR-024). Copied to /etc/systemd/system/k3s.service.d/10-after-docker.conf.
# Traefik's hostPort is bound to 172.17.0.1, the address of Docker's bridge docker0. After a reboot,
# k3s starts only once Docker is up, so the address exists before Traefik's port is set up.
# Wants, not Requires: k3s still starts if Docker fails.
[Unit]
After=docker.service
Wants=docker.service
