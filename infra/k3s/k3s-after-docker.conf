# systemd drop-in for k3s (ADR-024). Copied to /etc/systemd/system/k3s.service.d/10-after-docker.conf.
# The shared Caddy reaches Traefik through Docker's bridge docker0 (172.17.0.1, host.docker.internal).
# After a reboot, k3s starts only once Docker is up, so that route exists before Traefik takes
# traffic, and both come back in a known order. Wants, not Requires: k3s still starts if Docker
# fails.
[Unit]
After=docker.service
Wants=docker.service
