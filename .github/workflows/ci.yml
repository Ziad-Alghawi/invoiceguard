name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: invoiceguard
          POSTGRES_PASSWORD: invoiceguard-ci
          POSTGRES_DB: invoiceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVOICEGUARD_TEST_DATABASE_URL: postgresql+psycopg://invoiceguard:invoiceguard-ci@localhost:5432/invoiceguard_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    name: compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install the api test dependencies (for the KoSIT tests)
        working-directory: apps/api
        run: uv sync --locked
      - name: Create .env with a random password for the seed user (never in the repo)
        run: |
          cp .env.example .env
          echo "INVOICEGUARD_SEED_USER_PASSWORD=$(openssl rand -hex 24)" >> .env
      - name: Build images and start api, web, db, validator (waits for healthy)
        run: make dev
      - name: API /health returns ok
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | grep '"status":"ok"'
      - name: Web page shows API ok
        run: |
          curl --fail --silent --show-error http://localhost:3000 | grep -E 'API: (<!-- -->)?ok'
      - name: API /ready reaches the database
        run: |
          curl --fail --silent --show-error http://localhost:8000/ready | grep '"status":"ready"'
      - name: Seed demo data and the login user twice (idempotent)
        run: make seed && make seed && make seed-user && make seed-user
      - name: Invoices need a login; the seeded user logs in
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/invoices)" = 401
          set -a; . ./.env; set +a
          jq -n --arg email "$INVOICEGUARD_SEED_USER_EMAIL" --arg password "$INVOICEGUARD_SEED_USER_PASSWORD"             '{email: $email, password: $password}'             | curl --fail --silent --show-error --cookie-jar cookies.txt -H 'Content-Type: application/json'               --data @- http://localhost:8000/auth/login | jq .
          curl --fail --silent --show-error --cookie cookies.txt http://localhost:8000/auth/me | jq .
      - name: Web login page renders
        run: |
          curl --fail --silent --show-error http://localhost:3000/login | grep -q 'Log in'
      - name: KoSIT tests against the validator service
        working-directory: apps/api
        env:
          INVOICEGUARD_TEST_VALIDATOR_URL: http://localhost:8081/
        run: uv run pytest -m kosit --no-cov
      - name: Clean XRechnung ends ready with all checks passed (KoSIT included); the same file again 409
        run: |
          invoice=apps/api/tests/fixtures/ubl_xrechnung.xml
          .github/scripts/upload-and-wait.sh "$invoice" cookies.txt > clean.json
          jq . clean.json
          test "$(jq -r .status clean.json)" = ready
          test "$(jq -r '[.checks[] | select(.status != "passed")] | length' clean.json)" = 0
          test "$(jq -r '.checks[] | select(.type == "kosit") | .status' clean.json)" = passed
          test "$(curl --silent --cookie cookies.txt --output /dev/null --write-out '%{http_code}' -F file=@$invoice http://localhost:8000/invoices)" = 409
      - name: Changed IBAN (fraud sample) ends blocked with the registry evidence
        run: |
          .github/scripts/upload-and-wait.sh apps/api/tests/fixtures/ubl_fraud_iban.xml cookies.txt > fraud.json
          jq . fraud.json
          test "$(jq -r .status fraud.json)" = blocked
          test "$(jq -r '.checks[0].type + "=" + .checks[0].status' fraud.json)" = iban=failed
          test "$(jq -r '.checks[0].evidence.invoice_iban' fraud.json)" = DE58876543210000000099
          test "$(jq -r '.checks[0].evidence.verified_ibans[0].iban' fraud.json)" = DE60123456780000000003
      - name: Approve the clean invoice; the blocked one only with an override reason; audit rows
        run: |
          api=http://localhost:8000/invoices
          post() { curl --silent --cookie cookies.txt -H 'Content-Type: application/json' --output out.json --write-out '%{http_code}' --data "$2" "$1"; }
          clean=$(jq -r .id clean.json)
          fraud=$(jq -r .id fraud.json)
          test "$(post "$api/$clean/approve" '{}')" = 200
          test "$(jq -r .status out.json)" = approved
          test "$(post "$api/$fraud/approve" '{}')" = 409
          jq . out.json
          test "$(post "$api/$fraud/approve" '{"override_reason": "IBAN change confirmed by phone."}')" = 200
          test "$(jq -r .status out.json)" = approved
          curl --fail --silent --show-error --cookie cookies.txt "$api/$fraud/audit" > audit.json
          jq . audit.json
          test "$(jq -r '[.[].action] | .[-2:] | join(",")' audit.json)" = "invoice.override,invoice.approved"
          test "$(jq -r '.[-1].actor' audit.json)" = reviewer@example.com
      - name: Container logs
        if: failure()
        working-directory: infra
        run: docker compose --env-file ../.env logs
      - name: Stop
        if: always()
        run: make down
