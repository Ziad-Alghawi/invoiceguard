name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: actions pinned to commit SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag can be moved to other code; a full commit SHA cannot. Dependabot keeps the pins current.
      - name: Every third-party action is pinned to a full commit SHA
        run: |
          if grep -rnE '^\s*(-\s+)?uses:' .github/workflows | grep -vE 'uses:\s+\./|@[0-9a-f]{40}(\s|$)'; then
            echo "::error::Pin the actions above to a full commit SHA with the version in a comment"
            exit 1
          fi

  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: invoiceguard
          POSTGRES_PASSWORD: invoiceguard-ci
          POSTGRES_DB: invoiceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVOICEGUARD_TEST_DATABASE_URL: postgresql+psycopg://invoiceguard:invoiceguard-ci@localhost:5432/invoiceguard_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  mcp:
    name: ${{ matrix.server }} (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: [mcp-erp, mcp-registry, mcp-history]
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: invoiceguard
          POSTGRES_PASSWORD: invoiceguard-ci
          POSTGRES_DB: invoiceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVOICEGUARD_TEST_DATABASE_URL: postgresql+psycopg://invoiceguard:invoiceguard-ci@localhost:5432/invoiceguard_test
    defaults:
      run:
        working-directory: apps/${{ matrix.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/*/uv.lock
      # The tests build their database with the api's migrations and demo seed.
      - run: uv sync --locked
        working-directory: apps/api
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  evals:
    name: evals (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: invoiceguard
          POSTGRES_PASSWORD: invoiceguard-ci
          POSTGRES_DB: invoiceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The decision tests recreate <this database>_eval (ADR-019).
      INVOICEGUARD_TEST_DATABASE_URL: postgresql+psycopg://invoiceguard:invoiceguard-ci@localhost:5432/invoiceguard_test
    defaults:
      run:
        working-directory: packages/evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: packages/evals/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    name: compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install the api test dependencies (for the KoSIT tests)
        working-directory: apps/api
        run: uv sync --locked
      - name: Create .env with random passwords for the seed users and database roles (never in the repo)
        run: |
          cp .env.example .env
          echo "INVOICEGUARD_APP_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_SEED_USER_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_SEED_APPROVER_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_MCP_ERP_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_MCP_REGISTRY_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_MCP_HISTORY_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
      - name: Demo prod override, shared Caddy and its sites are valid (ADR-014)
        working-directory: infra
        run: |
          docker compose --env-file ../.env -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f edge/compose.yml config --quiet
          docker run --rm -v "$PWD/edge/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/edge/sites:/etc/caddy/sites:ro"             caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build images and start api, web, db, validator, MCP servers (waits for healthy)
        run: make dev
      - name: API /health returns ok
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | grep '"status":"ok"'
      - name: Web page shows API ok
        run: |
          curl --fail --silent --show-error http://localhost:3000 | grep -E 'API: (<!-- -->)?ok'
      - name: API /ready reaches the database
        run: |
          curl --fail --silent --show-error http://localhost:8000/ready | grep '"status":"ready"'
      - name: Seed demo data and the login users twice (idempotent)
        run: make seed && make seed && make seed-user && make seed-user
      - name: MCP servers answer as their read-only roles (ADR-017)
        working-directory: infra
        run: |
          call() {
            docker compose --env-file ../.env exec -T "$1" python -c "
          import anyio, json, sys
          from mcp import Client
          async def main():
              async with Client('http://127.0.0.1:8000/mcp') as client:
                  result = await client.call_tool(sys.argv[1], json.loads(sys.argv[2]))
              print(json.dumps(result.structured_content))
          anyio.run(main)
          " "$2" "$3"
          }
          call mcp-erp get_goods_receipts '{"po_number": "PO-2026-0004"}' | tee receipts.json
          test "$(jq -r '.receipts[0].number' receipts.json)" = WE-2026-0003
          call mcp-registry check_iban '{"iban": "DE58876543210000000099"}' | tee iban.json
          test "$(jq -r '.registered_to | length' iban.json)" = 0
      - name: The index loads the booking history and the rulebook; mcp-history answers (R3-4b)
        working-directory: infra
        run: |
          docker compose --env-file ../.env exec -T api invoiceguard-index
          docker compose --env-file ../.env exec -T mcp-history python -c "
          import anyio, json
          from mcp import Client
          async def main():
              async with Client('http://127.0.0.1:8000/mcp') as client:
                  history = await client.call_tool('get_invoice_history', {'vat_id': 'DE999000033'})
                  rulebook = await client.call_tool('search_rulebook', {'query': 'IBAN changed'})
              print(json.dumps([history.structured_content, rulebook.structured_content]))
          anyio.run(main)
          " | tee history.json
          test "$(jq '.[0].invoices | length' history.json)" -gt 0
          # No key in CI: full text. Ranking is close between sections that mention an IBAN, so
          # this checks the wiring (an IBAN section among the 3 results), not the order.
          jq -e '.[1].method == "text" and (.[1].sections | map(.key) | any(startswith("iban.md#")))' history.json
      - name: Invoices need a login; the seeded user logs in
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/invoices)" = 401
          # .env is read by make and Compose, not a shell script (values may contain spaces): read
          # the last value of each key, as make does.
          env_value() { grep "^$1=" .env | tail -n 1 | cut -d= -f2-; }
          jq -n --arg email "$(env_value INVOICEGUARD_SEED_USER_EMAIL)" \
            --arg password "$(env_value INVOICEGUARD_SEED_USER_PASSWORD)" \
            '{email: $email, password: $password}' \
            | curl --fail --silent --show-error --cookie-jar cookies.txt \
              -H 'Content-Type: application/json' --data @- http://localhost:8000/auth/login | jq .
          curl --fail --silent --show-error --cookie cookies.txt http://localhost:8000/auth/me | jq .
      - name: Web login page renders
        run: |
          curl --fail --silent --show-error http://localhost:3000/login | grep -q 'Log in'
      - name: KoSIT tests against the validator service
        working-directory: apps/api
        env:
          INVOICEGUARD_TEST_VALIDATOR_URL: http://localhost:8081/
        run: uv run pytest -m kosit --no-cov
      - name: Clean XRechnung ends ready with all checks passed (KoSIT included); the same file again 409
        run: |
          invoice=apps/api/tests/fixtures/ubl_xrechnung.xml
          .github/scripts/upload-and-wait.sh "$invoice" cookies.txt > clean.json
          jq . clean.json
          test "$(jq -r .status clean.json)" = ready
          test "$(jq -r '[.checks[] | select(.status != "passed")] | length' clean.json)" = 0
          test "$(jq -r '.checks[] | select(.type == "kosit") | .status' clean.json)" = passed
          test "$(curl --silent --cookie cookies.txt --output /dev/null --write-out '%{http_code}' -F file=@$invoice http://localhost:8000/invoices)" = 409
      - name: Changed IBAN (fraud sample) ends blocked with the registry evidence
        run: |
          .github/scripts/upload-and-wait.sh apps/api/tests/fixtures/ubl_fraud_iban.xml cookies.txt > fraud.json
          jq . fraud.json
          test "$(jq -r .status fraud.json)" = blocked
          test "$(jq -r '.checks[0].type + "=" + .checks[0].status' fraud.json)" = iban=failed
          test "$(jq -r '.checks[0].evidence.invoice_iban' fraud.json)" = DE58876543210000000099
          test "$(jq -r '.checks[0].evidence.verified_ibans[0].iban' fraud.json)" = DE60123456780000000003
      - name: Approve the clean invoice; the blocked one only by a four-eyes override; audit rows
        run: |
          api=http://localhost:8000/invoices
          post() { curl --silent --cookie "$1" -H 'Content-Type: application/json' --output out.json --write-out '%{http_code}' --data "$3" "$2"; }
          env_value() { grep "^$1=" .env | tail -n 1 | cut -d= -f2-; }
          jq -n --arg email "$(env_value INVOICEGUARD_SEED_APPROVER_EMAIL)" \
            --arg password "$(env_value INVOICEGUARD_SEED_APPROVER_PASSWORD)" \
            '{email: $email, password: $password}' \
            | curl --fail --silent --show-error --cookie-jar approver.txt \
              -H 'Content-Type: application/json' --data @- http://localhost:8000/auth/login | jq .
          clean=$(jq -r .id clean.json)
          fraud=$(jq -r .id fraud.json)
          test "$(post cookies.txt "$api/$clean/approve" '{}')" = 200
          test "$(jq -r .status out.json)" = approved
          test "$(post cookies.txt "$api/$fraud/approve" '{}')" = 409
          jq . out.json
          # The reviewer requests the override; only a different user with the approver role confirms.
          test "$(post cookies.txt "$api/$fraud/override" '{"reason": "IBAN change confirmed by phone."}')" = 200
          test "$(jq -r .status out.json)" = override_requested
          test "$(post cookies.txt "$api/$fraud/override/confirm" '{"reason": "Mine."}')" = 403
          test "$(post approver.txt "$api/$fraud/override/confirm" '{"reason": "Checked the call notes."}')" = 200
          test "$(jq -r .status out.json)" = approved
          curl --fail --silent --show-error --cookie cookies.txt "$api/$fraud/audit" > audit.json
          jq . audit.json
          test "$(jq -r '[.[].action] | .[-2:] | join(",")' audit.json)" = "invoice.override_requested,invoice.override_confirmed"
          test "$(jq -r '.[-1].actor' audit.json)" = approver@example.com
      - name: Demo reset in the built image loads the samples (KoSIT included)
        run: |
          (cd infra && docker compose --env-file ../.env run --rm -T -e INVOICEGUARD_DEMO_MODE=true migrate invoiceguard-demo-reset)
          curl --fail --silent --show-error --cookie cookies.txt 'http://localhost:8000/invoices?limit=10' > demo.json
          jq -r '.[] | .original_filename + " " + .status' demo.json | sort | tee demo.txt
          diff demo.txt - <<'TXT'
          01_it_service_clean.xml ready
          02_it_service_changed_iban.xml blocked
          03_logistik_over_po.xml blocked
          04_buerobedarf_cii.xml ready
          05_unknown_supplier_zugferd.xml ready
          06_it_service_injected_note.xml blocked
          TXT
      - name: Container logs
        if: failure()
        working-directory: infra
        run: docker compose --env-file ../.env logs
      - name: Stop
        if: always()
        run: make down

  e2e:
    name: e2e (Playwright on Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies and Chromium
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Create .env with random passwords for the seed users and database roles (never in the repo)
        run: |
          cp .env.example .env
          echo "INVOICEGUARD_APP_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_SEED_USER_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_SEED_APPROVER_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_MCP_ERP_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_MCP_REGISTRY_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "INVOICEGUARD_MCP_HISTORY_DB_PASSWORD=$(openssl rand -hex 24)" >> .env
      # No LLM key: the tests upload XML invoices only, so no model is called; "Investigate" shows
      # the recorded run (ADR-018).
      - name: Start the stack, seed demo data and the login users
        run: make dev && make seed && make seed-user
      - name: Log in, reject, approve, four-eyes override, export to DATEV, investigate (recorded run) in the browser
        env:
          CI: "true"
        run: make e2e
      - name: Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - name: Container logs
        if: failure()
        working-directory: infra
        run: docker compose --env-file ../.env logs
      - name: Stop
        if: always()
        run: make down

  images:
    name: image ${{ matrix.image }} (build, Trivy, GHCR)
    runs-on: ubuntu-latest
    # Pushing to GHCR needs this job only; every other job keeps read-only contents.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: apps/api
            # The rulebook is copied into the api image (Compose `additional_contexts`).
            extra: --build-context rulebook=docs/rulebook
          - image: web
            context: apps/web
          - image: mcp-erp
            context: apps/mcp-erp
          - image: mcp-registry
            context: apps/mcp-registry
          - image: mcp-history
            context: apps/mcp-history
          - image: validator
            context: services/validator
    env:
      # Tagged with the commit, so a deployment names exactly the code it runs (ADR-021).
      IMAGE: ghcr.io/${{ github.repository_owner }}/invoiceguard-${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          IMAGE="${IMAGE,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build ${{ matrix.extra }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "$IMAGE" ${{ matrix.context }}
      # Trivy's own image by digest, not trivy-action: its tags were rewritten in the March 2026
      # supply-chain attack (CVE-2026-33634). Fixable HIGH and CRITICAL findings fail the job;
      # accepted ones are listed in .trivyignore with a reason and an expiry date.
      - name: Scan with Trivy 0.76.2
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/trivyignore:ro" \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /trivyignore "$IMAGE"
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"

  helm:
    name: helm (lint, template, install on k3d)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.sha }}
      # k3d runs k3s in Docker: the same Traefik, local-path storage and NetworkPolicy controller as
      # the server (ADR-021, ADR-023).
      K3D_VERSION: v5.9.0
      K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  # pragma: allowlist secret
      K3S_IMAGE: rancher/k3s:v1.36.6-k3s1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Lint and render both charts; without an image tag the chart refuses to render
        run: |
          helm lint --strict infra/helm/invoiceguard-postgres
          helm lint --strict infra/helm/invoiceguard --set image.tag="$TAG"
          helm template invoiceguard-postgres infra/helm/invoiceguard-postgres > /dev/null
          helm template invoiceguard infra/helm/invoiceguard --set image.tag="$TAG" > /dev/null
          if helm template invoiceguard infra/helm/invoiceguard > /dev/null 2>&1; then
            echo "::error::the chart rendered without image.tag"; exit 1
          fi
      - name: Install k3d (pinned version, checked against its SHA-256)
        run: |
          curl --fail --silent --show-error --location --output k3d \
            "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_SHA256  k3d" | sha256sum --check
          sudo install k3d /usr/local/bin/k3d && rm k3d
      # The images of a pull request are not in GHCR (only main pushes), so they are built here and
      # imported into the cluster under the names the chart uses.
      - name: Build the six images
        run: |
          prefix=ghcr.io/ziad-alghawi/invoiceguard
          docker build --build-context rulebook=docs/rulebook --tag "$prefix-api:$TAG" apps/api
          docker build --tag "$prefix-web:$TAG" apps/web
          for server in mcp-erp mcp-registry mcp-history; do
            docker build --tag "$prefix-$server:$TAG" "apps/$server"
          done
          docker build --tag "$prefix-validator:$TAG" services/validator
      - name: Start k3d and import the images
        run: |
          k3d cluster create invoiceguard --image "$K3S_IMAGE" --port "8080:80@loadbalancer" --wait
          k3d image import --cluster invoiceguard \
            $(for image in api web mcp-erp mcp-registry mcp-history validator; do
              echo "ghcr.io/ziad-alghawi/invoiceguard-$image:$TAG"; done)
      - name: Install both charts; owner, ingress, 413, health, demo reset, login, NetworkPolicies, upgrade
        run: .github/scripts/k3d-smoke-test.sh "$TAG" 8080
      # The server's platform files at their pinned hashes (ADR-024); their CRDs let the API server
      # check the Argo CD Applications, the SealedSecrets and the Traefik settings (dry run).
      - name: Pinned platform files match their hashes; Argo CD and k3s manifests are valid
        run: |
          infra/k3s/fetch.sh "$RUNNER_TEMP/platform"
          for file in argocd-core-install.yaml sealed-secrets-controller.yaml; do
            yq 'select(.kind == "CustomResourceDefinition")' "$RUNNER_TEMP/platform/$file" \
              | kubectl apply --server-side --filename -
          done
          # A new CRD's kind is served only once it is Established.
          kubectl wait --for condition=established --timeout=60s \
            crd/applications.argoproj.io crd/sealedsecrets.bitnami.com
          kubectl create namespace argocd
          kubectl apply --dry-run=server --filename infra/k3s/traefik-config.yaml
          kubectl apply --dry-run=server --filename infra/argocd/root.yaml --filename infra/argocd/apps
      # Last: the server's Traefik settings, merged into k3s's own Traefik chart as on the server;
      # Traefik must start with them (a dry run cannot see a flag the chart builds wrongly).
      - name: Traefik starts with the server's settings (hostPort 8880, entrypoint address, ClusterIP)
        run: .github/scripts/k3d-traefik-config-test.sh
      - name: Cluster state and logs
        if: failure()
        run: |
          kubectl --namespace kube-system get pods
          kubectl --namespace kube-system logs deployment/traefik --tail=20 || true
          kubectl --namespace invoiceguard get all,pvc,jobs,networkpolicies
          kubectl --namespace invoiceguard get events --sort-by=.lastTimestamp
          for pod in $(kubectl --namespace invoiceguard get pods --output name); do
            echo "=== $pod"
            kubectl --namespace invoiceguard logs "$pod" --all-containers --tail=100
          done

  # CD (ADR-021): Argo CD follows the git tag `demo`. Once every job of a `main` commit has passed
  # and its six images are in GHCR, the tag moves to that commit and Argo CD deploys it within about
  # three minutes. Moving a tag needs no commit, so no bot appears as an author.
  demo-tag:
    name: move the demo tag (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pins, api, mcp, evals, web, compose-smoke, e2e, images, helm]
    runs-on: ubuntu-latest
    # Writing the tag needs this job only.
    permissions:
      contents: write
    concurrency:
      group: demo-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A re-run of an older workflow must not deploy older code over newer code. A rollback by
      # hand (the tag moved to an older commit) is still followed by the next merge.
      - name: Move demo to this commit unless it already points at a later one
        run: |
          if git rev-parse --quiet --verify refs/tags/demo > /dev/null \
            && ! git merge-base --is-ancestor refs/tags/demo "$GITHUB_SHA"; then
            echo "demo is at $(git rev-parse refs/tags/demo), which is not an ancestor of $GITHUB_SHA: not moved"
            exit 0
          fi
          git tag --force demo "$GITHUB_SHA"
          git push --force origin refs/tags/demo
          echo "demo -> $GITHUB_SHA"
