name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: invoiceguard
          POSTGRES_PASSWORD: invoiceguard-ci
          POSTGRES_DB: invoiceguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INVOICEGUARD_TEST_DATABASE_URL: postgresql+psycopg://invoiceguard:invoiceguard-ci@localhost:5432/invoiceguard_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    name: compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Build images and start api, web, db (waits for healthy)
        run: make dev
      - name: API /health returns ok
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | grep '"status":"ok"'
      - name: Web page shows API ok
        run: |
          curl --fail --silent --show-error http://localhost:3000 | grep -E 'API: (<!-- -->)?ok'
      - name: API /ready reaches the database
        run: |
          curl --fail --silent --show-error http://localhost:8000/ready | grep '"status":"ready"'
      - name: Seed demo data twice (idempotent)
        run: make seed && make seed
      - name: Upload an XML invoice returns 201, the same file again 409
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"/>\n' > rechnung.xml
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -F file=@rechnung.xml http://localhost:8000/invoices)" = 201
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -F file=@rechnung.xml http://localhost:8000/invoices)" = 409
      - name: Container logs
        if: failure()
        working-directory: infra
        run: docker compose --env-file ../.env logs
      - name: Stop
        if: always()
        run: make down
