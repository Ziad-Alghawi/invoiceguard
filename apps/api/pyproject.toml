[project]
name = "invoiceguard-api"
version = "0.1.0"
description = "InvoiceGuard backend API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "factur-x==7.9",
    "fastapi>=0.162.4",
    "litellm==1.108.1",
    "lxml==6.1.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdf==7.0.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
invoiceguard-seed = "invoiceguard_api.seed:main"
invoiceguard-seed-user = "invoiceguard_api.seed_user:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "migrations", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# factur-x ships no type information; we call one function (parsing/pdf.py).
module = ["facturx", "facturx.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=invoiceguard_api --cov-report=term-missing"
filterwarnings = [
    "error",
    # LiteLLM 1.108 declares TypedDicts with ReadOnly items; pydantic warns when it first uses them.
    "ignore:Items? .* on TypedDict class .* using the `ReadOnly` qualifier:UserWarning",
]
markers = [
    "kosit: needs a running KoSIT validator (INVOICEGUARD_TEST_VALIDATOR_URL); skipped without it",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
# argon2-cffi-bindings 26.2.0 was published on the day we added argon2-cffi; stay on the release
# that has been out for months until a newer one has had time to settle.
constraint-dependencies = ["argon2-cffi-bindings==26.1.0"]
